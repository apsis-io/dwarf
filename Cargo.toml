[workspace]
members = ["crates/core", "crates/runtime", "napi"]
default-members = [".", "napi"]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

[workspace.dependencies]
dwarf-core = { path = "crates/core", version = "0.4.1", default-features = false }
dwarf = { path = ".", version = "0.4.1", default-features = false }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
wasmtime = { version = "46", features = ["component-model", "async"] }
wasmtime-wasi = { version = "46", default-features = false, features = ["p2", "p3"] }
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
wit-parser = "0.252"

[package]
name = "dwarf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Convert JavaScript to WebAssembly components (WASI Preview 3) using QuickJS"
license.workspace = true
readme = "README.md"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/dwarf-v{ version }-{ target }.{ archive-format }"
bin-dir = "dwarf-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[lib]
name = "dwarf_cli"
path = "src/lib.rs"

[[bin]]
name = "dwarf"
path = "src/main.rs"
doc = false

[dependencies]
dwarf-core.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
oxc_minifier = "0.138.0"
oxc_allocator = "0.138.0"
oxc_codegen = "0.138.0"
oxc_parser = "0.138.0"
oxc_span = "0.138.0"

[features]
default = ["component-model-async"]
opt-size = ["dwarf-core/opt-size"]
component-model-async = ["dwarf-core/component-model-async"]

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
quickcheck = "1"
tempfile = "3.13"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
wasmtime.workspace = true
wasmtime-wasi.workspace = true
wit-parser.workspace = true

[profile.release]
lto = "thin"

[profile.dev]
debug = "line-tables-only"
incremental = true
lto = false

[profile.test]
debug = "line-tables-only"
incremental = false
opt-level = 3
